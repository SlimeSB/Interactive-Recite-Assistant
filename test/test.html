<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit Tests - Interactive Recite Assistant</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Microsoft YaHei', Consolas, monospace; max-width: 900px; margin: 40px auto; padding: 20px; background: #f5f5f5; }
    h1 { text-align: center; margin-bottom: 20px; color: #333; }
    .suite { background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .suite h2 { color: #555; margin-bottom: 15px; border-bottom: 2px solid #4CAF50; padding-bottom: 8px; }
    .test { padding: 10px 15px; margin: 5px 0; border-radius: 4px; }
    .pass { background: #e8f5e8; border-left: 4px solid #4CAF50; }
    .fail { background: #ffebee; border-left: 4px solid #f44336; }
    .test-name { font-weight: bold; margin-bottom: 3px; }
    .test-detail { font-size: 13px; color: #666; margin-left: 8px; }
    .fail .test-detail { color: #c62828; }
    .stats { text-align: center; font-size: 18px; padding: 15px; background: #333; color: white; border-radius: 8px; margin-top: 20px; }
    .stats span { margin: 0 15px; }
    .stats .pass-count { color: #4CAF50; }
    .stats .fail-count { color: #f44336; }
  </style>
</head>
<body>
  <h1>Unit Tests</h1>
  <div id="parserSuite" class="suite"><h2>parser.js</h2></div>
  <div id="clozeSuite" class="suite"><h2>cloze.js</h2></div>
  <div class="stats">
    Passed: <span id="passCount" class="pass-count">0</span>
    Failed: <span id="failCount" class="fail-count">0</span>
    Total: <span id="totalCount">0</span>
  </div>

  <script type="module">
    import { processText, splitContent, getAllArticleSentences, getAllValidPositions } from '../script/parser.js';

    let passCount = 0;
    let failCount = 0;
    const suites = {};

    function assert(name, condition, detail) {
      const suiteDiv = document.getElementById(currentSuite);
      const div = document.createElement('div');
      if (condition) {
        div.className = 'test pass';
        div.innerHTML = `<div class="test-name">&#x2713; ${name}</div>${detail ? '<div class="test-detail">' + detail + '</div>' : ''}`;
        passCount++;
      } else {
        div.className = 'test fail';
        div.innerHTML = `<div class="test-name">&#x2717; ${name}</div>${detail ? '<div class="test-detail">' + detail + '</div>' : ''}`;
        failCount++;
      }
      suiteDiv.appendChild(div);
      updateStats();
    }

    function updateStats() {
      document.getElementById('passCount').textContent = passCount;
      document.getElementById('failCount').textContent = failCount;
      document.getElementById('totalCount').textContent = passCount + failCount;
    }

    let currentSuite = 'parserSuite';

    // ===== parser.js tests =====
    const sampleText = '1\u2192\u5e8a\u524d\u660e\u6708\u5149\uff0c\u7591\u662f\u5730\u4e0a\u971c\u3002\n2\u2192\u4e3e\u5934\u671b\u660e\u6708\uff0c\u4f4e\u5934\u601d\u6545\u4e61\u3002';

    const { articles, sentences } = processText(sampleText);

    assert('processText returns correct article count', articles.length === 2, `Expected 2, got ${articles.length}`);
    assert('Article 1 has correct lineNumber', articles[0].lineNumber === '1\u2192', `Got "${articles[0].lineNumber}"`);
    assert('Article 1 has correct content', articles[0].content === '\u5e8a\u524d\u660e\u6708\u5149\uff0c\u7591\u662f\u5730\u4e0a\u971c\u3002', `Got "${articles[0].content}"`);
    assert('Article 2 has correct lineNumber', articles[1].lineNumber === '2\u2192', `Got "${articles[1].lineNumber}"`);
    assert('processText handles missing line numbers', () => {
      const r = processText('\u968f\u624b\u4e00\u53e5\n2\u2192\u6b63\u5e38\u884c');
      return r.articles[0].lineNumber === '1\u2192';
    }(), 'Default line number should be "1\u2192"');

    // Test splitContent
    const parts = splitContent('\u5e8a\u524d\u660e\u6708\u5149\uff0c\u7591\u662f\u5730\u4e0a\u971c\u3002');
    assert('splitContent splits on punctuation', parts.length >= 4, `Got ${parts.length} parts: ${JSON.stringify(parts)}`);
    assert('splitContent includes punctuation tokens', parts.includes('\uff0c') && parts.includes('\u3002'), `Parts: ${JSON.stringify(parts)}`);

    // Test getAllValidPositions
    const positions = getAllValidPositions(parts);
    assert('getAllValidPositions finds valid text positions', positions.length === 2, `Expected 2, got ${positions.length}`);

    // Test getAllArticleSentences
    const article1 = articles[0];
    const sentences1 = getAllArticleSentences(article1, parts);
    assert('getAllArticleSentences builds correct prefixed sentences', sentences1[0].startsWith('1\u2192'), `Got "${sentences1[0]}"`);
    assert('getAllArticleSentences returns correct count', sentences1.length === 2, `Expected 2, got ${sentences1.length}`);

    // Test empty text
    const emptyResult = processText('');
    assert('processText returns empty arrays for empty input', emptyResult.articles.length === 0, `Got ${emptyResult.articles.length}`);

    // Test text without line numbers
    const noNumber = processText('\u53ea\u6709\u4e00\u884c\u6587\u5b57');
    assert('processText generates default line numbers', noNumber.articles[0].lineNumber === '1\u2192', `Got "${noNumber.articles[0].lineNumber}"`);

    // ===== cloze.js tests =====
    currentSuite = 'clozeSuite';

    import { generateArticleCloze, generateFullRecite, generateSequenceClozePositions } from '../script/cloze.js';
    import { setArticles, setConfig, setMode, setSequenceIndex, markCorrect, isMastered, getState } from '../script/state.js';

    // Setup state for cloze tests
    const testArticles = [
      { id: 1, lineNumber: '1\u2192', content: '\u5e8a\u524d\u660e\u6708\u5149\uff0c\u7591\u662f\u5730\u4e0a\u971c\u3002', fullText: '1\u2192\u5e8a\u524d\u660e\u6708\u5149\uff0c\u7591\u662f\u5730\u4e0a\u971c\u3002' },
      { id: 2, lineNumber: '2\u2192', content: '\u4e3e\u5934\u671b\u660e\u6708\uff0c\u4f4e\u5934\u601d\u6545\u4e61\u3002', fullText: '2\u2192\u4e3e\u5934\u671b\u660e\u6708\uff0c\u4f4e\u5934\u601d\u6545\u4e61\u3002' },
    ];
    setArticles(testArticles, []);

    const defaultConfig = {
      clozeConfig: { minCount: 1, smallArticleRatio: 0.3, largeArticleMin: 3, largeArticleMax: 5, smallArticleThreshold: 10 },
      reviewConfig: { reviewClozeCount: 1 },
      uiConfig: { errorSectionDefaultCollapsed: true },
    };
    setConfig(defaultConfig);
    setMode('random');

    // Test generateArticleCloze in random mode
    const result = generateArticleCloze(0);
    assert('generateArticleCloze returns result for valid index', result !== null && result !== undefined, `Got ${result}`);
    assert('generateArticleCloze returns article', result && result.article && result.article.id === 1, `Article id: ${result && result.article && result.article.id}`);
    assert('generateArticleCloze returns parts array', result && Array.isArray(result.parts), `Is array: ${Array.isArray(result && result.parts)}`);
    assert('generateArticleCloze generates cloze positions', result && Array.isArray(result.clozePositions) && result.clozePositions.length > 0, `Positions: ${JSON.stringify(result && result.clozePositions)}`);
    assert('generateArticleCloze does not exceed max positions', result && result.clozePositions.length <= 4, `Got ${result && result.clozePositions.length} positions`);

    // Test with mastered sentences (should enter review mode)
    markCorrect('1\u2192\u5e8a\u524d\u660e\u6708\u5149\uff0c');
    markCorrect('1\u2192\u7591\u662f\u5730\u4e0a\u971c\u3002');
    const reviewResult = generateArticleCloze(0);
    assert('generateArticleCloze enters review mode when all mastered', reviewResult && reviewResult.allMastered === true, `allMastered: ${reviewResult && reviewResult.allMastered}`);
    assert('review mode has 1 cloze position', reviewResult && reviewResult.clozePositions.length === 1, `Got ${reviewResult && reviewResult.clozePositions.length}`);

    // Test generateFullRecite
    const fullRecite = generateFullRecite(0);
    assert('generateFullRecite returns result', fullRecite !== null, `Got ${fullRecite}`);
    assert('generateFullRecite blanks all positions', fullRecite && fullRecite.clozePositions.length === 2, `Got ${fullRecite && fullRecite.clozePositions.length}`);

    // Test sequence mode
    setMode('sequence');
    setSequenceIndex(0);
    const seqResult = generateArticleCloze(0);
    assert('sequence mode has 1 cloze position', seqResult && seqResult.clozePositions.length <= 1, `Got ${seqResult && seqResult.clozePositions.length}`);

    // Test generateSequenceClozePositions directly
    setMode('sequence');
    setSequenceIndex(0);
    const article = testArticles[0];
    const testParts = article.content.split(/([\uff0c\u3002\uff1b\uff01\uff1f\uff1a])/).filter(Boolean);
    const seqPositions = generateSequenceClozePositions(article, testParts, 0);
    assert('generateSequenceClozePositions finds position', seqPositions && seqPositions.clozePositions.length === 1, `Got ${JSON.stringify(seqPositions)}`);

    // Test invalid index
    const badResult = generateArticleCloze(999);
    assert('generateArticleCloze returns null for invalid index', badResult === null, `Got ${badResult}`);

    updateStats();
  </script>
</body>
</html>
